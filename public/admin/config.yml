backend:
  name: github
  repo: rajput88lg/rajput-lalit-associates
  branch: main
  base_url: https://earnest-sawine-e89e73.netlify.app
  site_domain: earnest-sawine-e89e73.netlify.app

media_folder: "public/blog-images"
public_folder: "/blog-images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blogs"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "URL mein jo dikhega, jaise: gst-registration-guide" }
      - { label: "Category", name: "category", widget: "select", options: ["GST", "Income Tax", "Accounting & TDS", "Business Registration", "Business & Finance"] }
      - { label: "Short Description", name: "description", widget: "text", hint: "Blog list mein jo preview dikhega (1-2 lines)" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Read Time (minutes)", name: "readTime", widget: "string", default: "8 min read" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Blog Content", name: "body", widget: "markdown" }
